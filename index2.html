<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Kerwzy">
<title>A FEW QUESTIONS BEFORE YOU GO</title>
<style>
    :root {
        --bg-color: #010101;
        --text-color: #c0c0c0;
        --accent-color: #7a0000;
    }
    body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: 'Courier New', Courier, monospace;
        overflow: hidden;
        user-select: none;
        cursor: none !important;
    }
    * {
        cursor: none !important;
    }
    #custom-cursor {
        position: fixed;
        width: 6px;
        height: 6px;
        background-color: rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        pointer-events: none;
        z-index: 10000;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
        transition: transform 0.1s ease;
    }
    #custom-cursor.clicking {
        transform: translate(-50%, -50%) scale(0.6);
        background-color: #ff2222;
        box-shadow: 0 0 10px #ff0000;
    }
    #crt-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                    linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
        background-size: 100% 3px, 3px 100%;
        z-index: 100;
        opacity: 0.85;
    }
    #main-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 10;
    }
    #quiz-panel {
        width: 620px;
        max-width: 90%;
        min-height: 320px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 1.2s ease-in-out;
    }
    .visible {
        opacity: 1 !important;
    }
    #question-header {
        font-size: 0.85rem;
        color: #555;
        margin-bottom: 25px;
        letter-spacing: 3px;
        height: 1.5rem;
    }
    #question-text {
        font-size: 1.15rem;
        text-align: center;
        margin-bottom: 35px;
        line-height: 1.6;
        min-height: 3.5rem;
        text-shadow: 0 0 3px rgba(200, 200, 200, 0.15);
    }
    #options-container {
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 100%;
        align-items: center;
        position: relative;
    }
    .option-btn {
        background: transparent;
        border: 1px solid #282828;
        color: #777;
        padding: 12px 24px;
        width: 80%;
        max-width: 320px;
        font-family: inherit;
        font-size: 0.95rem;
        transition: all 0.25s;
        text-transform: uppercase;
        letter-spacing: 2px;
        position: relative;
        pointer-events: auto;
    }
    .option-btn:hover, .option-btn.force-hover {
        background: #080808;
        border-color: #555;
        color: #eee;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
    }
    .option-btn:disabled {
        pointer-events: none;
        opacity: 0.4;
    }
    .option-btn.btn-hijack {
        border-color: #4a0000;
        color: #bb3333;
        animation: pulse-border 1.2s infinite;
        letter-spacing: 3px;
        font-weight: bold;
    }
    @keyframes pulse-border {
        0% { border-color: #2a0000; box-shadow: 0 0 0 rgba(100, 0, 0, 0); }
        50% { border-color: #6a0000; box-shadow: 0 0 10px rgba(100, 0, 0, 0.3); }
        100% { border-color: #2a0000; box-shadow: 0 0 0 rgba(100, 0, 0, 0); }
    }
    #creepy-input {
        background: transparent;
        border: 1px solid #333;
        color: #eee;
        padding: 12px;
        font-family: inherit;
        font-size: 1rem;
        text-align: center;
        width: 80%;
        max-width: 320px;
        outline: none;
        letter-spacing: 2px;
    }
    #input-hint {
        font-size: 0.7rem;
        color: #444;
        margin-top: 10px;
        letter-spacing: 1px;
    }
    .glitch-text {
        animation: glitch-anim 0.08s linear infinite;
        color: #880000 !important;
        text-shadow: 2px 0 #330000, -2px 0 #002233 !important;
    }
    @keyframes glitch-anim {
        0% { transform: translate(0) }
        20% { transform: translate(-2px, 1px) }
        40% { transform: translate(-1px, -2px) }
        60% { transform: translate(2px, 1px) }
        80% { transform: translate(1px, -1px) }
        100% { transform: translate(0) }
    }
    #system-messages {
        position: fixed;
        color: rgba(255, 0, 0, 0.25);
        font-size: 0.65rem;
        pointer-events: none;
        z-index: 50;
        opacity: 0;
        font-family: monospace;
    }
    #anomaly-canvas {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 5;
    }
    .shake {
        animation: shake-anim 0.3s cubic-bezier(.36, .07, .19, .97) both;
    }
    @keyframes shake-anim {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    #blackout {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: black;
        z-index: 200;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #subliminal-text {
        color: #888;
        font-size: 0.9rem;
        letter-spacing: 3px;
        opacity: 0;
        text-transform: uppercase;
    }
    #fake-crash {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #000;
        z-index: 300;
        display: none;
        flex-direction: column;
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 40px;
        box-sizing: border-box;
    }
    .crash-title { font-size: 2rem; margin-bottom: 20px; color: #fff; }
    .crash-desc { font-size: 1rem; color: #aaa; margin-bottom: 40px; }
    .crash-code { font-size: 0.8rem; color: #444; font-family: monospace; }
</style>
</head>
<body>

<div id="custom-cursor"></div>
<div id="crt-overlay"></div>
<canvas id="anomaly-canvas"></canvas>
<div id="system-messages"></div>

<div id="fake-crash">
    <div class="crash-title">Aw, Snap!</div>
    <div class="crash-desc">Something went wrong while displaying this webpage.<br>To continue, reload or go to another page.</div>
    <div class="crash-code">ERR_MEMORY_CORRUPTION_0x000000A1</div>
</div>

<div id="blackout"><div id="subliminal-text"></div></div>

<div id="main-container">
    <div id="quiz-panel">
        <div id="question-header"></div>
        <div id="question-text"></div>
        <div id="options-container"></div>
    </div>
</div>

<script>
    const elPanel = document.getElementById('quiz-panel');
    const elHeader = document.getElementById('question-header');
    const elText = document.getElementById('question-text');
    const elOptions = document.getElementById('options-container');
    const elSys = document.getElementById('system-messages');
    const cvs = document.getElementById('anomaly-canvas');
    const ctx = cvs.getContext('2d');
    const elBlackout = document.getElementById('blackout');
    const elSubliminal = document.getElementById('subliminal-text');
    const elCrash = document.getElementById('fake-crash');
    const cursor = document.getElementById('custom-cursor');

    let actx;
    let masterGain;
    let humOsc, humGain;
    let whisperSource, whisperGain;
    let heartbeatActive = false;
    let heartbeatInterval = 1100;
    let heartbeatTimer = null;
    
    let isAlone = false;
    let realMouseX = window.innerWidth / 2;
    let realMouseY = window.innerHeight / 2;
    let cursorX = window.innerWidth / 2;
    let cursorY = window.innerHeight / 2;
    
    let cursorResistanceTarget = null;
    let cursorHijacked = false;
    let hijackTargetX = 0;
    let hijackTargetY = 0;
    
    let showAfterimage = false;
    let afterimageY = window.innerHeight * 0.8;
    let afterimageX = window.innerWidth * 0.88;
    
    let stareActive = false;
    let stareRadius = window.innerWidth;

    window.addEventListener('resize', () => {
        cvs.width = window.innerWidth;
        cvs.height = window.innerHeight;
    });
    cvs.width = window.innerWidth;
    cvs.height = window.innerHeight;

    window.addEventListener('mousemove', (e) => {
        realMouseX = e.clientX;
        realMouseY = e.clientY;
    });

    function cursorLoop() {
        let targetX = realMouseX;
        let targetY = realMouseY;

        if (cursorHijacked) {
            targetX = hijackTargetX;
            targetY = hijackTargetY;
            cursorX += (targetX - cursorX) * 0.045;
            cursorY += (targetY - cursorY) * 0.045;
        } else {
            if (cursorResistanceTarget) {
                const rect = cursorResistanceTarget.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const dist = Math.hypot(targetX - centerX, targetY - centerY);
                
                if (dist < 140) {
                    const angle = Math.atan2(targetY - centerY, targetX - centerX);
                    const push = (140 - dist) * 0.35;
                    targetX += Math.cos(angle) * push;
                    targetY += Math.sin(angle) * push;
                }
            }
            cursorX += (targetX - cursorX) * 0.22;
            cursorY += (targetY - cursorY) * 0.22;
        }
        
        cursor.style.left = cursorX + 'px';
        cursor.style.top = cursorY + 'px';
        
        requestAnimationFrame(cursorLoop);
    }
    cursorLoop();

    document.addEventListener('click', (e) => {
        if (!e.isTrusted || cursorHijacked) return;
        const el = document.elementFromPoint(cursorX, cursorY);
        if (el && el.classList.contains('option-btn') && !el.disabled) {
            el.click();
        }
    });

    function drawCanvas() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);

        if (showAfterimage) {
            afterimageY -= 0.12;
            ctx.fillStyle = "rgba(4, 4, 4, 0.02)";
            ctx.shadowBlur = 35;
            ctx.shadowColor = "#000";
            ctx.beginPath();
            ctx.ellipse(afterimageX, afterimageY, 50, 130, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        if (stareActive) {
            stareRadius -= 1.2;
            if (stareRadius < 35) stareRadius = 35;
            const grad = ctx.createRadialGradient(cvs.width / 2, cvs.height / 2, stareRadius * 0.1, cvs.width / 2, cvs.height / 2, stareRadius);
            grad.addColorStop(0, "rgba(0,0,0,0)");
            grad.addColorStop(1, "rgba(0,0,0,0.98)");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, cvs.width, cvs.height);

            ctx.fillStyle = "#660000";
            ctx.beginPath();
            ctx.arc(cvs.width / 2, cvs.height / 2, 3.5, 0, Math.PI * 2);
            ctx.fill();
        }

        requestAnimationFrame(drawCanvas);
    }
    drawCanvas();

    function initAudio() {
        if (actx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        actx = new AudioContext();
        masterGain = actx.createGain();
        masterGain.gain.value = 0.22;
        masterGain.connect(actx.destination);

        humOsc = actx.createOscillator();
        humGain = actx.createGain();
        humOsc.type = 'sine';
        humOsc.frequency.value = 42;
        humGain.gain.value = 0;
        humOsc.connect(humGain);
        humGain.connect(masterGain);
        humOsc.start();
    }

    function setHum(val, time) {
        if (!actx) return;
        humGain.gain.setTargetAtTime(val, actx.currentTime, time);
    }

    function playClick() {
        if (!actx) return;
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(750, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, actx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.035, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
        osc.stop(actx.currentTime + 0.05);
    }

    function playGlitch() {
        if (!actx) return;
        const buf = actx.createBuffer(1, actx.sampleRate * 0.15, actx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const noise = actx.createBufferSource();
        noise.buffer = buf;
        const gain = actx.createGain();
        gain.gain.setValueAtTime(0.04, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.005, actx.currentTime + 0.15);
        noise.connect(gain);
        gain.connect(masterGain);
        noise.start();
    }

    function playHeartbeatThud() {
        if (!actx) return;
        const now = actx.currentTime;
        
        const osc1 = actx.createOscillator();
        const gain1 = actx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(58, now);
        osc1.frequency.exponentialRampToValueAtTime(32, now + 0.08);
        gain1.gain.setValueAtTime(0.18, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc1.connect(gain1);
        gain1.connect(masterGain);
        osc1.start(now);
        osc1.stop(now + 0.09);

        const osc2 = actx.createOscillator();
        const gain2 = actx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(52, now + 0.1);
        osc2.frequency.exponentialRampToValueAtTime(28, now + 0.2);
        gain2.gain.setValueAtTime(0.14, now + 0.1);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc2.connect(gain2);
        gain2.connect(masterGain);
        osc2.start(now + 0.1);
        osc2.stop(now + 0.21);
    }

    function startHeartbeat(intervalMs) {
        heartbeatActive = true;
        heartbeatInterval = intervalMs;
        
        function beat() {
            if (!heartbeatActive) return;
            playHeartbeatThud();
            heartbeatTimer = setTimeout(beat, heartbeatInterval);
        }
        beat();
    }

    function stopHeartbeat() {
        heartbeatActive = false;
        if (heartbeatTimer) clearTimeout(heartbeatTimer);
    }

    function playHeavySubThud() {
        if (!actx) return;
        const now = actx.currentTime;
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(90, now);
        osc.frequency.exponentialRampToValueAtTime(15, now + 1.2);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        osc.stop(now + 1.3);
    }

    function startWhispers() {
        if (!actx) return;
        const bufSize = actx.sampleRate * 4;
        const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        
        whisperSource = actx.createBufferSource();
        whisperSource.buffer = buf;
        whisperSource.loop = true;
        
        const filter = actx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 950;
        
        whisperGain = actx.createGain();
        whisperGain.gain.value = 0.015;

        whisperSource.connect(filter);
        filter.connect(whisperGain);
        whisperGain.connect(masterGain);
        whisperSource.start();
    }

    function playCrashSound() {
        if (!actx) return;
        const osc = actx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = 52;
        const gain = actx.createGain();
        gain.gain.value = 0.08;
        
        const lfo = actx.createOscillator();
        lfo.type = 'square';
        lfo.frequency.value = 18;
        const lfoGain = actx.createGain();
        lfoGain.gain.value = 0.08;
        lfo.connect(lfoGain);
        lfoGain.connect(gain.gain);
        lfo.start();
        
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
        setTimeout(() => { osc.stop(); lfo.stop(); }, 3500);
    }

    function sleep(ms) {
        return new Promise(res => setTimeout(res, ms));
    }

    function typeTextAsync(text, speed = 45) {
        return new Promise(res => {
            elText.innerHTML = '';
            let i = 0;
            function type() {
                if (i < text.length) {
                    elText.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed + (Math.random() * speed));
                } else {
                    res();
                }
            }
            type();
        });
    }

    async function fadeOutUI() {
        elPanel.classList.remove('visible');
        await sleep(1300);
        elHeader.innerText = '';
        elText.innerHTML = '';
        elOptions.innerHTML = '';
    }

    async function fadeInUI() {
        elPanel.classList.add('visible');
        await sleep(1300);
    }

    function askQuestion(header, text, options) {
        return new Promise(res => {
            elHeader.innerText = header;
            elText.innerHTML = text;
            elOptions.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    if (btn.disabled) return;
                    const allBtns = elOptions.querySelectorAll('.option-btn');
                    allBtns.forEach(b => b.disabled = true);
                    playClick();
                    cursorResistanceTarget = null;
                    res(opt);
                };
                elOptions.appendChild(btn);
            });
            elPanel.classList.add('visible');
        });
    }

    function askHijackedInput(header, text, forcedText) {
        return new Promise(res => {
            elHeader.innerText = header;
            elText.innerHTML = text;
            elOptions.innerHTML = '';

            const inp = document.createElement('input');
            inp.type = 'text';
            inp.id = 'creepy-input';
            inp.autocomplete = 'off';
            elOptions.appendChild(inp);
            
            const hint = document.createElement('div');
            hint.id = 'input-hint';
            hint.innerText = '(Type your answer)';
            elOptions.appendChild(hint);

            let idx = 0;
            inp.addEventListener('keydown', (e) => {
                e.preventDefault();
                if (e.key.length === 1 || e.key === 'Backspace' || e.key === ' ') {
                    if (idx < forcedText.length) {
                        inp.value += forcedText[idx];
                        idx++;
                        playClick();
                        
                        if (idx >= forcedText.length) {
                            inp.disabled = true;
                            hint.innerText = '';
                            setTimeout(() => {
                                res(inp.value);
                            }, 800);
                        }
                    }
                }
            });

            elPanel.classList.add('visible');
            setTimeout(() => inp.focus(), 1400);
        });
    }

    async function sequence() {
        await askQuestion('', 'A FEW QUESTIONS BEFORE YOU GO', ['START']);
        await fadeOutUI();
        initAudio();
        setHum(0.08, 2);

        const ans1 = await askQuestion('QUESTION 1', 'Are you currently alone?', ['YES', 'NO']);
        if (ans1 === 'YES') isAlone = true;
        await fadeOutUI();

        await askQuestion('QUESTION 2', 'Is the door behind you closed?', ['YES', 'NO', 'I DO NOT KNOW']);
        await fadeOutUI();

        await askHijackedInput('QUESTION 3', 'Where are you right now?', 'I CANNOT LEAVE');
        await fadeOutUI();

        showAfterimage = true;
        
        await askQuestion('QUESTION 4', 'Did you hear that?', ['YES', 'NO']);
        startWhispers();
        await fadeOutUI();

        elHeader.innerText = 'QUESTION 5';
        elText.innerHTML = 'Are you sure nobody is watching you?';
        elOptions.innerHTML = '';
        
        const btnY = document.createElement('button');
        btnY.className = 'option-btn'; btnY.innerText = 'YES';
        const btnN = document.createElement('button');
        btnN.className = 'option-btn'; btnN.innerText = 'NO';
        
        cursorResistanceTarget = btnY; 
        
        const p5 = new Promise(res => {
            btnY.onclick = () => { if (btnY.disabled) return; btnY.disabled = true; btnN.disabled = true; playClick(); cursorResistanceTarget = null; res('YES'); };
            btnN.onclick = () => { if (btnN.disabled) return; btnY.disabled = true; btnN.disabled = true; playClick(); cursorResistanceTarget = null; res('NO'); };
        });
        elOptions.appendChild(btnY);
        elOptions.appendChild(btnN);
        await fadeInUI();
        await p5;
        await fadeOutUI();

        if (isAlone) {
            elHeader.innerText = '';
            elText.innerHTML = '';
            elOptions.innerHTML = '';
            elPanel.classList.add('visible');
            await sleep(800);
            await typeTextAsync('You said you were alone.', 50);
            await sleep(1800);
            await typeTextAsync('You were wrong.', 90);
            await sleep(1800);
            await fadeOutUI();
        }

        elHeader.innerText = 'QUESTION 6';
        elText.innerHTML = '';
        elOptions.innerHTML = '';
        elPanel.classList.add('visible');
        await sleep(800);
        await typeTextAsync('DO NOT BLINK.', 50);
        await sleep(900);
        await typeTextAsync('STARE AT THE RED DOT IN THE CENTER.', 40);
        await sleep(1200);
        
        elText.innerHTML = '';
        stareActive = true;
        stareRadius = window.innerWidth;
        
        let mx = realMouseX;
        let my = realMouseY;
        
        const stareCheck = (e) => {
            if (Math.abs(e.clientX - mx) > 3 || Math.abs(e.clientY - my) > 3) {
                window.removeEventListener('mousemove', stareCheck);
                stareActive = false;
                playGlitch();
                document.body.classList.add('shake');
                elText.classList.add('glitch-text');
                elText.innerText = 'I SAW YOU MOVE.';
            }
            mx = e.clientX;
            my = e.clientY;
        };
        window.addEventListener('mousemove', stareCheck);
        
        await sleep(4500);
        window.removeEventListener('mousemove', stareCheck);
        stareActive = false;
        elText.classList.remove('glitch-text');
        await fadeOutUI();

        playCrashSound();
        elCrash.style.display = 'flex';
        cursor.style.display = 'none';
        await sleep(3500);
        elCrash.style.display = 'none';
        cursor.style.display = 'block';

        await askQuestion('QUESTION 7', 'Why did you go back?', ['I DID NOT', 'I HAD TO', 'I DO NOT KNOW']);
        await fadeOutUI();

        setHum(0.2, 2);
        elHeader.innerText = '';
        elText.innerHTML = '';
        elOptions.innerHTML = '';
        elPanel.classList.add('visible');
        await sleep(800);
        await typeTextAsync('PLEASE ANSWER HONESTLY.', 75);
        await sleep(1800);
        await fadeOutUI();

        await askQuestion('FINAL QUESTION', 'Who is playing this game?', ['Maria', 'The player', 'Nobody', "I don't know"]);
        elOptions.innerHTML = '';
        elHeader.innerText = '';
        elText.innerText = 'WRONG.';
        await sleep(1800);
        await typeTextAsync('I KNOW WHO YOU ARE.', 90);
        await sleep(1800);
        await typeTextAsync("YOU'VE BEEN HERE BEFORE.", 90);
        await sleep(1400);
        await typeTextAsync("YOU JUST DON'T REMEMBER.", 90);
        await sleep(2000);

        await runClimax();
    }

    async function runClimax() {
        startHeartbeat(1000);
        setHum(0.04, 1);
        if (whisperGain) whisperGain.gain.setTargetAtTime(0, actx.currentTime, 1);

        elHeader.innerText = '';
        elText.classList.add('glitch-text');
        
        elText.innerText = 'HOLD YOUR BREATH.';
        await sleep(2500);
        
        heartbeatInterval = 750;
        elText.innerText = 'DO NOT LOOK AWAY.';
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 300);
        await sleep(2400);

        heartbeatInterval = 500;
        elText.innerText = 'IT IS STANDING RIGHT BEHIND YOU.';
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 400);
        await sleep(2200);

        heartbeatInterval = 360;
        elText.classList.remove('glitch-text');
        elText.innerText = '';
        elOptions.innerHTML = '';

        const hijackBtn = document.createElement('button');
        hijackBtn.className = 'option-btn btn-hijack';
        hijackBtn.innerText = 'LET ME IN';
        elOptions.appendChild(hijackBtn);

        await sleep(600);

        const btnRect = hijackBtn.getBoundingClientRect();
        hijackTargetX = btnRect.left + btnRect.width / 2;
        hijackTargetY = btnRect.top + btnRect.height / 2;
        cursorHijacked = true;

        await sleep(2400);

        hijackBtn.classList.add('force-hover');
        cursor.classList.add('clicking');
        playClick();
        
        await sleep(350);

        stopHeartbeat();
        setHum(0, 0.05);
        playHeavySubThud();

        document.body.style.filter = "invert(1) contrast(2)";
        document.body.classList.add('shake');
        
        await sleep(250);

        document.body.style.filter = "none";
        document.body.classList.remove('shake');
        elPanel.style.display = 'none';

        elBlackout.style.opacity = '1';
        elBlackout.style.pointerEvents = 'all';

        await sleep(1000);

        elSubliminal.style.opacity = '1';
        elSubliminal.innerText = 'opening...';

        await sleep(1500);

        window.location.replace('index3.html');
    }

    window.onload = () => {
        sequence();
    };
</script>
