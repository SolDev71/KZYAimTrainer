<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="author" content="Kerwzy" />
<title>Help the Cat Get Home!</title>
<style>
  :root {
    --sky: #bfe9ff;
    --grass: #8fd66a;
    --grass2: #7cc75c;
    --ink: #2f3b2a;
    --ui: #fffdf5;
    --ui-border: #e4d9b6;
    --accent: #ff9ec4;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0a0a0a;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #d9f2ff, #a9dcf5);
    transition: filter 0.5s linear;
  }
  canvas {
    display: block;
    image-rendering: auto;
    touch-action: none;
    max-width: 100%;
    max-height: 100%;
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(20, 40, 20, 0.35);
  }
  .hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    gap: 12px;
    z-index: 5;
  }
  .panel {
    background: var(--ui);
    border: 3px solid var(--ui-border);
    border-radius: 16px;
    padding: 10px 16px;
    box-shadow: 0 6px 0 rgba(0, 0, 0, 0.08);
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .panel small {
    display: block;
    font-weight: 600;
    opacity: 0.6;
    font-size: 11px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
  }
  #counter {
    font-size: 22px;
  }
  #hint {
    font-size: 13px;
    font-weight: 600;
    opacity: 0.85;
  }
  #toast {
    position: fixed;
    left: 50%;
    top: 18%;
    transform: translateX(-50%);
    font: 600 13px/1.4 "Courier New", monospace;
    color: #5a5a5a;
    opacity: 0;
    letter-spacing: 2px;
    z-index: 8;
    pointer-events: none;
  }
  #dialog {
    position: fixed;
    left: 50%;
    bottom: 12%;
    transform: translateX(-50%);
    width: min(560px, 86vw);
    background: #0e0e10;
    border: 2px solid #2a2a2e;
    color: #e8e8e8;
    padding: 22px 24px;
    border-radius: 6px;
    font: 600 18px/1.6 "Courier New", monospace;
    letter-spacing: 2px;
    display: none;
    z-index: 9;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
  }
  #dialog .loc {
    font-size: 13px;
    opacity: 0.7;
    margin-top: 14px;
    letter-spacing: 3px;
    white-space: pre-line;
  }
  #sys {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    background: #000;
    color: #cfcfcf;
    font: 600 20px/1.6 "Courier New", monospace;
    letter-spacing: 4px;
    z-index: 20;
    text-align: center;
    padding: 24px;
  }
  #bar {
    width: min(420px, 80vw);
    height: 10px;
    border: 1px solid #3a3a3a;
    display: none;
  }
  #barfill {
    height: 100%;
    width: 0%;
    background: #880000;
  }
  #flash {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 30;
    transition: opacity 0.4s linear;
  }
  #terminal {
    position: fixed;
    inset: 0;
    background: #000;
    color: #00ff00;
    font: 500 14px/1.4 "Courier New", monospace;
    padding: 20px;
    overflow: hidden;
    display: none;
    z-index: 60;
    white-space: pre-wrap;
    text-shadow: 0 0 4px #00ff00;
  }
  #start {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: linear-gradient(#cfeeff, #a9dcf5);
    z-index: 40;
  }
  #start h1 {
    font-size: clamp(28px, 6vw, 52px);
    color: #3c6b2f;
    text-shadow: 0 3px 0 #fff;
  }
  #start p {
    color: #456;
    font-weight: 600;
  }
  #start button {
    pointer-events: auto;
    cursor: pointer;
    border: none;
    background: var(--accent);
    color: #fff;
    font: 800 20px/1 "Trebuchet MS", sans-serif;
    padding: 16px 34px;
    border-radius: 999px;
    box-shadow: 0 6px 0 #e07ba6;
    letter-spacing: 1px;
  }
  #start button:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 #e07ba6;
  }
  .shake {
    animation: sh 0.08s linear infinite;
  }
  @keyframes sh {
    0% { transform: translate(0) rotate(0deg); }
    25% { transform: translate(-8px, 4px) rotate(-1deg); }
    50% { transform: translate(8px, -4px) rotate(1deg); }
    75% { transform: translate(-4px, -8px) rotate(0deg); }
    100% { transform: translate(4px, 8px) rotate(-1deg); }
  }
  #welcome {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: #000;
    z-index: 70;
    color: #fff;
    overflow: hidden;
  }
  #welcome.active {
    display: flex;
  }
  #welcome::before,
  #welcome::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, #0a0a0a 3px);
    pointer-events: none;
    opacity: 0.65;
  }
  #welcome::after {
    background: repeating-linear-gradient(90deg, transparent, transparent 1px, rgba(255, 0, 0, 0.15) 2px, rgba(0, 255, 0, 0.1) 3px, rgba(0, 0, 255, 0.15) 4px);
    opacity: 0.45;
    mix-blend-mode: screen;
    animation: rgbSlide 0.08s infinite;
  }
  .welcome-text {
    font-family: "Courier New", monospace;
    font-size: clamp(28px, 7vw, 100px);
    font-weight: 900;
    letter-spacing: 8px;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.1;
    color: #ff0000;
    position: relative;
    animation: glitchFlicker 0.4s infinite alternate, textShake 0.1s infinite;
  }
  .welcome-text span {
    display: inline-block;
  }
  .welcome-sub {
    font-family: "Courier New", monospace;
    font-size: clamp(11px, 2vw, 16px);
    color: #ff0000;
    letter-spacing: 8px;
    margin-top: 24px;
    opacity: 0;
    animation: fadeInDelay 0.5s forwards 1.5s;
  }
  .scanline {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.4) 50%, rgba(0, 0, 0, 0.4));
    background-size: 100% 4px;
    pointer-events: none;
    animation: scanlineMove 4s linear infinite;
    opacity: 0.65;
  }
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, transparent 20%, #000 85%);
    pointer-events: none;
  }
  @keyframes glitchFlicker {
    0%, 18%, 22%, 26%, 45%, 55%, 80%, 100% { opacity: 1; text-shadow: 6px 0 #ff0000, -6px 0 #00ffff; }
    19%, 21%, 27%, 44%, 56%, 79% { opacity: 0.85; text-shadow: -8px 0 #ff0000, 8px 0 #00ffff; transform: translate(3px, -3px); }
    20%, 25%, 50%, 78% { opacity: 0.4; text-shadow: 8px 0 #ff0000, -8px 0 #00ffff; transform: translate(-3px, 3px); }
  }
  @keyframes textShake {
    0% { transform: translate(0, 0); }
    20% { transform: translate(-3px, 3px); }
    40% { transform: translate(3px, -3px); }
    60% { transform: translate(-3px, -3px); }
    80% { transform: translate(3px, 3px); }
    100% { transform: translate(0, 0); }
  }
  @keyframes rgbSlide {
    0% { transform: translateX(0); }
    50% { transform: translateX(5px); }
    100% { transform: translateX(0); }
  }
  @keyframes scanlineMove {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100%); }
  }
  @keyframes fadeInDelay {
    to { opacity: 1; }
  }
  .blood-overlay {
    position: fixed;
    inset: 0;
    background: #ff0000;
    mix-blend-mode: multiply;
    opacity: 0;
    pointer-events: none;
    z-index: 35;
  }
  #fs-req {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 10, 0.85);
    backdrop-filter: blur(8px);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  #fs-req.active {
    opacity: 1;
    pointer-events: auto;
  }
  .fs-box {
    background: var(--ui);
    border: 4px solid var(--accent);
    border-radius: 24px;
    padding: 40px 60px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    animation: float-fs 3s ease-in-out infinite;
  }
  .fs-box h2 {
    font-size: 28px;
    color: var(--ink);
    margin-bottom: 16px;
    font-family: "Trebuchet MS", sans-serif;
  }
  .fs-box p {
    font-size: 16px;
    color: #555;
    margin-bottom: 30px;
    font-weight: 600;
  }
  .fs-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 14px 36px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 0 #e07ba6;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .fs-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #e07ba6;
  }
  @keyframes float-fs {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .pulse-circle {
    width: 80px;
    height: 80px;
    background: var(--accent);
    border-radius: 50%;
    margin: 0 auto 24px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pulse-circle::before, .pulse-circle::after {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 4px solid var(--accent);
    animation: ripple 2s linear infinite;
  }
  .pulse-circle::after {
    animation-delay: 1s;
  }
  @keyframes ripple {
    0% { transform: scale(0.8); opacity: 1; }
    100% { transform: scale(2); opacity: 0; }
  }
  .pulse-circle svg {
    width: 40px;
    height: 40px;
    fill: #fff;
    z-index: 2;
    position: relative;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div class="hud">
  <div class="panel"><small id="lbl">Cats Found</small><div id="counter">0 / 3</div></div>
  <div class="panel" id="hint">Move with WASD or arrow keys 誓</div>
</div>

<div id="toast"></div>
<div id="dialog"><div id="dlgtext"></div><div class="loc" id="dlgloc"></div></div>

<div id="sys"><div id="systext"></div><div id="bar"><div id="barfill"></div></div></div>
<div id="terminal"></div>
<div id="flash"></div>
<div class="blood-overlay" id="blood"></div>

<div id="welcome">
  <div class="vignette"></div>
  <div class="scanline"></div>
  <div class="welcome-text" id="welcomeText">WELCOME TO THE GAME</div>
  <div class="welcome-sub">YOU ARE ALREADY PLAYING</div>
</div>

<div id="start">
  <h1>Help the Cat Get Home! 棲</h1>
  <p>Find all 3 lost kittens, then walk home. Simple and cozy.</p>
  <button id="go">Play</button>
</div>

<div id="fs-req">
  <div class="fs-box">
    <div class="pulse-circle">
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </div>
    <h2>Fullscreen Required</h2>
    <p>Please expand the window to continue playing.</p>
    <button class="fs-btn" id="fs-btn">Enter Fullscreen</button>
  </div>
</div>

<script>
(() => {
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 600;
cv.width = W; cv.height = H;

function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

let AC = null, master = null, droneMaster = null, musicOn = false, musicTimer = null, detune = 0, droneOsc = null;

function initAudio() {
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) {
    return;
  }
  master = AC.createGain();
  master.gain.value = 0.12;
  master.connect(AC.destination);
  
  droneMaster = AC.createGain();
  droneMaster.gain.value = 0;
  droneMaster.connect(AC.destination);
}

function blip(freq, dur = 0.12, type = 'sine', vol = 1) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.value = freq * Math.pow(2, detune / 1200);
  g.gain.setValueAtTime(0, AC.currentTime);
  g.gain.linearRampToValueAtTime(0.25 * vol, AC.currentTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  o.connect(g);
  g.connect(master);
  o.start();
  o.stop(AC.currentTime + dur + 0.02);
}

function startDrone() {
  if (!AC || droneOsc) return;
  droneOsc = AC.createOscillator();
  droneOsc.type = 'sawtooth';
  droneOsc.frequency.value = 35;
  droneOsc.connect(droneMaster);
  droneOsc.start();
  droneMaster.gain.linearRampToValueAtTime(0.4, AC.currentTime + 10);
}

function stopDrone() {
  if (droneMaster) {
    droneMaster.gain.linearRampToValueAtTime(0, AC.currentTime + 1);
  }
}

function playNoise(dur, vol = 0.5) {
  if (!AC) return;
  const buf = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    data[i] = Math.random() * 2 - 1;
  }
  const src = AC.createBufferSource();
  src.buffer = buf;
  const g = AC.createGain();
  g.gain.value = vol;
  const f = AC.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = 2000;
  src.connect(g);
  g.connect(f);
  f.connect(master);
  src.start();
}

function triggerHeartbeat() {
  if (!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(50, t);
  o.frequency.exponentialRampToValueAtTime(0.01, t + 0.5);
  g.gain.setValueAtTime(1, t);
  g.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
  o.connect(g);
  g.connect(master);
  o.start(t);
  o.stop(t + 0.5);
}

const MEL = [523, 659, 784, 659, 587, 494, 587, 659, 523, 659, 784, 880, 784, 659, 587, 523];
let mi = 0;

function startMusic() {
  if (!AC || musicOn) return;
  musicOn = true;
  musicTimer = setInterval(() => {
    if (!musicOn) return;
    blip(MEL[mi % MEL.length], 0.22, 'triangle', 0.7);
    if (mi % 4 === 0) blip(MEL[mi % MEL.length] / 2, 0.3, 'sine', 0.5);
    mi++;
  }, 330);
}

function stopMusic() {
  musicOn = false;
  clearInterval(musicTimer);
}

function toZalgo(text) {
  const zalgoChars = [];
  for (let i = 0; i < 75; i++) zalgoChars.push(String.fromCharCode(768 + Math.random() * 112));
  return text.split('').map(c => {
    if (c === ' ') return c;
    let res = c;
    const numZalgo = Math.floor(Math.random() * 5);
    for (let i = 0; i < numZalgo; i++) {
      res += zalgoChars[Math.floor(Math.random() * zalgoChars.length)];
    }
    return res;
  }).join('');
}

const rnd = (a, b) => a + Math.random() * (b - a);
const world = { w: 1800, h: 1200 };
const cam = { x: 0, y: 0 };
const cat = { x: 250, y: 900, vx: 0, vy: 0, dir: 1, walk: 0, facePlayer: 0, frozen: false, black: false, stretch: 1, hollow: false };
const house = { x: 1520, y: 220, w: 180, h: 150 };
const trees = [], flowers = [], bushes = [];

for (let i = 0; i < 26; i++) {
  trees.push({ x: rnd(80, world.w - 80), y: rnd(80, world.h - 80), s: rnd(0.85, 1.25), gone: false, sway: rnd(0, 6.28) });
}
for (let i = 0; i < 90; i++) {
  flowers.push({ x: rnd(20, world.w - 20), y: rnd(20, world.h - 20), c: ['#ff8fb1', '#ffd76e', '#fff', '#c58bff'][i % 4] });
}
for (let i = 0; i < 18; i++) {
  bushes.push({ x: rnd(60, world.w - 60), y: rnd(60, world.h - 60), s: rnd(0.8, 1.3) });
}

const kittens = [
  { x: 760, y: 1020, got: false, c: '#ffd9a0', bob: 0 },
  { x: 380, y: 360, got: false, c: '#ffffff', bob: 1.4 },
  { x: 1380, y: 820, got: false, c: '#b8b0ff', bob: 2.6 }
];

const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let running = false, gameStarted = false, t = 0, found = 0, stage = 0, lagBuffer = [], inputLag = 0;
let corruption = 0, missingTiles = [], flicker = 0, ended = false, staticOverlay = 0, redFlash = false;

const counterEl = document.getElementById('counter');
const lblEl = document.getElementById('lbl');
const hintEl = document.getElementById('hint');
const toastEl = document.getElementById('toast');
const dlg = document.getElementById('dialog');
const dlgText = document.getElementById('dlgtext');
const dlgLoc = document.getElementById('dlgloc');
const sys = document.getElementById('sys');
const sysText = document.getElementById('systext');
const bar = document.getElementById('bar');
const barfill = document.getElementById('barfill');
const flash = document.getElementById('flash');
const hud = document.querySelector('.hud');
const welcome = document.getElementById('welcome');
const welcomeText = document.getElementById('welcomeText');
const terminal = document.getElementById('terminal');
const bloodOverlay = document.getElementById('blood');
const stageDiv = document.getElementById('stage');
const fsReq = document.getElementById('fs-req');
const fsBtn = document.getElementById('fs-btn');

const wait = ms => new Promise(r => setTimeout(r, ms));

function toast(msg, ms = 900) {
  toastEl.textContent = msg;
  toastEl.style.transition = 'opacity 0.25s';
  toastEl.style.opacity = 0.85;
  setTimeout(() => { toastEl.style.opacity = 0; }, ms);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawTree(o) {
  if (o.gone) return;
  const s = o.s, sway = Math.sin(t / 600 + o.sway) * 2;
  ctx.fillStyle = cat.black && corruption > 2 ? '#000' : '#8a5a33';
  ctx.fillRect(o.x - 6 * s, o.y - 10 * s, 12 * s, 34 * s);
  ctx.fillStyle = corruption > 2 ? '#0b0b0b' : '#4fae4a';
  ctx.beginPath(); ctx.arc(o.x + sway, o.y - 34 * s, 30 * s, 0, 7); ctx.fill();
  ctx.fillStyle = corruption > 2 ? '#050505' : '#63c95c';
  ctx.beginPath(); ctx.arc(o.x - 12 * s + sway, o.y - 46 * s, 20 * s, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(o.x + 14 * s + sway, o.y - 44 * s, 18 * s, 0, 7); ctx.fill();
}

function drawBush(o) {
  ctx.fillStyle = corruption > 2 ? '#080808' : '#5cbf58';
  ctx.beginPath();
  ctx.arc(o.x, o.y, 20 * o.s, 0, 7);
  ctx.arc(o.x + 16 * o.s, o.y + 4 * o.s, 15 * o.s, 0, 7);
  ctx.arc(o.x - 16 * o.s, o.y + 4 * o.s, 15 * o.s, 0, 7);
  ctx.fill();
}

function drawCatShape(x, y, scale, color, facing, frontFace, walkPhase, blackOut, stretch = 1, hollow = false) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale * (frontFace ? 1 : facing), scale * stretch);
  const body = blackOut ? '#000' : color;
  
  ctx.strokeStyle = body;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-16, -6);
  ctx.quadraticCurveTo(-30, -14 + Math.sin(walkPhase) * 4, -26, -26);
  ctx.stroke();
  
  ctx.fillStyle = body;
  const lw = Math.sin(walkPhase) * 3;
  ctx.fillRect(-12, 4, 6, 10 + lw);
  ctx.fillRect(6, 4, 6, 10 - lw);
  
  ctx.fillStyle = body;
  roundRect(-18, -14, 36, 22, 11);
  ctx.fill();
  
  roundRect(-2, -30, 26, 24, 10);
  ctx.fill();
  
  ctx.beginPath();
  ctx.moveTo(2, -28);
  ctx.lineTo(4, -40);
  ctx.lineTo(12, -30);
  ctx.closePath();
  ctx.fill();
  
  ctx.beginPath();
  ctx.moveTo(14, -30);
  ctx.lineTo(22, -40);
  ctx.lineTo(24, -27);
  ctx.closePath();
  ctx.fill();
  
  if (!blackOut) {
    ctx.fillStyle = '#2b2b2b';
    if (frontFace) {
      if (hollow) {
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(6, -20, 4, 0, 7); ctx.arc(18, -20, 4, 0, 7); ctx.fill();
        ctx.fillStyle = '#f00';
        ctx.beginPath(); ctx.arc(6, -20, 1, 0, 7); ctx.arc(18, -20, 1, 0, 7); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(6, -20, 2.6, 0, 7); ctx.arc(18, -20, 2.6, 0, 7); ctx.fill();
        ctx.fillStyle = '#ff8fb1';
        ctx.beginPath(); ctx.arc(12, -14, 2, 0, 7); ctx.fill();
      }
    } else {
      ctx.beginPath(); ctx.arc(12, -20, 2.6, 0, 7); ctx.arc(20, -20, 2.6, 0, 7); ctx.fill();
      ctx.fillStyle = '#ff8fb1';
      ctx.beginPath(); ctx.arc(22, -14, 2, 0, 7); ctx.fill();
    }
  } else {
    ctx.fillStyle = redFlash ? '#f00' : '#fff';
    ctx.beginPath();
    ctx.arc(6, -20, hollow ? 4 : 2.2, 0, 7);
    ctx.arc(18, -20, hollow ? 4 : 2.2, 0, 7);
    ctx.fill();
  }
  ctx.restore();
}

function drawHouse() {
  const { x, y, w, h } = house;
  ctx.fillStyle = corruption > 2 ? '#0a0a0a' : '#fff3dd';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = corruption > 2 ? '#111' : '#e07ba6';
  ctx.beginPath();
  ctx.moveTo(x - 16, y);
  ctx.lineTo(x + w / 2, y - 70);
  ctx.lineTo(x + w + 16, y);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = corruption > 2 ? '#000' : '#a9724b';
  ctx.fillRect(x + w / 2 - 22, y + h - 64, 44, 64);
  ctx.fillStyle = corruption > 2 ? '#000' : '#bfe9ff';
  ctx.fillRect(x + 18, y + 26, 38, 34);
  ctx.fillRect(x + w - 56, y + 26, 38, 34);
}

function update(dt) {
  if (!cat.frozen && !ended) {
    const sp = corruption >= 4 ? 0.5 : 2.6;
    let dx = 0, dy = 0;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    
    if (inputLag > 0) {
      lagBuffer.push({ dx, dy });
      const old = lagBuffer.length > (corruption >= 4 ? 40 : 18) ? lagBuffer.shift() : { dx: 0, dy: 0 };
      dx = old.dx;
      dy = old.dy;
    }
    
    const l = Math.hypot(dx, dy) || 1;
    dx /= l;
    dy /= l;
    cat.x = Math.max(30, Math.min(world.w - 30, cat.x + dx * sp * dt));
    cat.y = Math.max(40, Math.min(world.h - 20, cat.y + dy * sp * dt));
    
    if (dx !== 0) cat.dir = dx > 0 ? 1 : -1;
    if (dx || dy) {
      cat.walk += 0.18 * dt;
    } else {
      cat.walk *= 0.9;
    }
  }
  
  cam.x += ((cat.x - W / 2) - cam.x) * 0.08 * dt;
  cam.y += ((cat.y - H / 2) - cam.y) * 0.08 * dt;
  cam.x = Math.max(0, Math.min(world.w - W, cam.x));
  cam.y = Math.max(0, Math.min(world.h - H, cam.y));

  if (!ended) {
    kittens.forEach(k => {
      if (!k.got && Math.hypot(k.x - cat.x, k.y - cat.y) < 44) collect(k);
    });
  }
}

function draw() {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  
  if (corruption >= 4) {
    g.addColorStop(0, '#100000');
    g.addColorStop(1, '#050000');
  } else if (corruption >= 3) {
    g.addColorStop(0, '#0c0c0c');
    g.addColorStop(1, '#050505');
  } else if (corruption >= 1) {
    g.addColorStop(0, '#86cf68');
    g.addColorStop(1, '#6fbb54');
  } else {
    g.addColorStop(0, '#8fd66a');
    g.addColorStop(1, '#78c857');
  }
  
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.translate(-cam.x, -cam.y);
  
  for (let x = 0; x < world.w; x += 80) {
    for (let y = 0; y < world.h; y += 80) {
      if (missingTiles.some(m => m.x === x && m.y === y)) {
        ctx.fillStyle = redFlash ? '#400' : '#000';
        ctx.fillRect(x, y, 80, 80);
        continue;
      }
      if (((x / 80) + (y / 80)) % 2 === 0) {
        ctx.fillStyle = corruption >= 3 ? 'rgba(255,255,255,0.015)' : 'rgba(255,255,255,0.07)';
        ctx.fillRect(x, y, 80, 80);
      }
    }
  }
  
  if (corruption < 3) {
    flowers.forEach(f => {
      ctx.fillStyle = f.c;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 3.2, 0, 7);
      ctx.fill();
    });
  }
  
  ctx.strokeStyle = corruption >= 3 ? 'rgba(60,60,60,0.3)' : 'rgba(255,245,210,0.65)';
  ctx.lineWidth = 30;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(250, 940);
  ctx.quadraticCurveTo(800, 860, 1100, 600);
  ctx.quadraticCurveTo(1350, 430, 1600, 380);
  ctx.stroke();

  drawHouse();
  bushes.forEach(drawBush);
  trees.slice().sort((a, b) => a.y - b.y).forEach(drawTree);

  kittens.forEach(k => {
    if (k.got) return;
    const bob = Math.sin(t / 300 + k.bob) * 4;
    drawCatShape(k.x, k.y + bob, 0.8, k.c, 1, corruption >= 2, t / 200, corruption >= 4, 1, corruption >= 2);
    if (corruption < 2) {
      ctx.font = '16px sans-serif';
      ctx.fillStyle = '#000';
      ctx.fillText('笶､', k.x - 6, k.y - 46 + bob);
    }
  });

  drawCatShape(cat.x, cat.y, 1.15, '#ffb26b', cat.dir, cat.facePlayer > 0, cat.walk, cat.black, cat.stretch, cat.hollow);

  ctx.restore();

  if (flicker > 0 && Math.random() < flicker) {
    ctx.fillStyle = Math.random() < 0.1 ? '#ff0000' : 'rgba(0,0,0,' + (0.4 + Math.random() * 0.6) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  
  if (staticOverlay > 0) {
    const id = ctx.createImageData(W, H);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const val = Math.random() * 255;
      d[i] = val;
      d[i + 1] = val;
      d[i + 2] = val;
      d[i + 3] = staticOverlay * 255;
    }
    ctx.putImageData(id, 0, 0);
  }

  if (corruption >= 4) {
    for (let i = 0; i < 15; i++) {
      const y = Math.random() * H;
      ctx.fillStyle = Math.random() > 0.8 ? 'rgba(255,0,0,0.1)' : 'rgba(0,0,0,0.8)';
      ctx.fillRect(0, y, W, Math.random() * 12);
    }
  }
}

let last = 0;
function loop(ts) {
  const dt = Math.min(3, (ts - last) / 16.67) || 1;
  last = ts;
  t = ts;
  if (running) {
    update(dt);
    draw();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

async function collect(k) {
  k.got = true;
  found++;
  counterEl.textContent = found + ' / 3';
  blip(880, 0.1, 'triangle');
  setTimeout(() => blip(1174, 0.16, 'triangle'), 110);
  
  if (found === 1) stageOne();
  if (found === 2) stageTwoThree();
  if (found === 3) stageFour();
  else if (found < 3) hintEl.textContent = found === 1 ? 'Nice! 2 kittens left 誓' : 'One more kitten to find!';
}

async function stageOne() {
  stage = 1;
  await wait(4200);
  const vis = trees.filter(tr => !tr.gone);
  const pick = vis[Math.floor(Math.random() * vis.length)];
  pick.gone = true;
  detune = -40;
  const b = bushes[0];
  const ox = b.x;
  b.x += 26;
  await wait(1800);
  pick.gone = false;
  detune = 0;
  b.x = ox;
}

async function stageTwoThree() {
  stage = 2;
  hintEl.textContent = 'One more kitten to find!';
  await wait(2600);
  cat.frozen = true;
  await wait(900);
  cat.facePlayer = 1;
  stopMusic();
  playNoise(0.5, 0.2);
  flicker = 0.05;
  await wait(1700);
  startMusic();
  detune = -200;
  flicker = 0;
  cat.facePlayer = 0;
  cat.frozen = false;

  await wait(5000);
  stage = 3;
  lblEl.textContent = 'Cats Found';
  counterEl.textContent = '2 / 3';
  await wait(1200);
  counterEl.textContent = toZalgo('2 / 3 ');
  lblEl.textContent = toZalgo('Cats Found');
  playNoise(0.2, 0.4);
  await wait(700);
  lblEl.textContent = 'Cats Found';
  hintEl.textContent = 'Move with WASD or arrow keys 誓';
  await wait(2600);
  toast(toZalgo("don't move"), 620);
  triggerHeartbeat();
  await wait(1400);
  hintEl.textContent = toZalgo('One more kitten to find!');
}

async function stageFour() {
  ended = true;
  cat.frozen = true;
  stage = 4;
  counterEl.textContent = '3 / 3';
  detune = -600;
  await wait(600);
  cat.facePlayer = 1;
  cat.hollow = true;
  stopMusic();
  startDrone();
  
  for (let i = 0; i < 30; i++) {
    cat.stretch += 0.05;
    await wait(50);
  }
  
  hud.style.transition = 'opacity 1.2s';
  hud.style.opacity = 0;
  dlg.style.display = 'block';
  dlgText.textContent = toZalgo('I KNOW WHERE YOU LIVE.');
  playNoise(1, 0.8);
  
  await wait(3200);
  dlgText.textContent = toZalgo('I CAN SEE YOU.');
  triggerHeartbeat();
  
  await wait(2400);
  const regions = ['SECTOR 7-B', 'THE QUIET ROOM', 'BLOCK 04', 'NOWHERE', 'BEHIND YOU'];
  dlgLoc.textContent = toZalgo('LOCATION DETECTED\nREGION: ' + regions[Math.floor(Math.random() * regions.length)] + '\nSTATUS: FOUND');
  bloodOverlay.style.transition = 'opacity 4s';
  bloodOverlay.style.opacity = 0.4;
  
  await wait(4200);
  dlg.style.display = 'none';
  stageFive();
}

async function terminalGlitch() {
  terminal.style.display = 'block';
  const lines = [
    "INITIATING ROOT OVERRIDE...",
    "SCANNING LOCAL DRIVES...",
    "C:\\Users\\Profile\\AppData\\Local...",
    "UPLOADING FILE STRUCTURE [||||||||||] 100%",
    "ACCESSING WEBCAM FEED...",
    "DEVICE RECOGNIZED.",
    "BYPASSING SECURITY PROTOCOLS...",
    "EXTRACTING KEELOG...",
    "CONNECTION ESTABLISHED.",
    "WAKE UP.",
    "WAKE UP.",
    "WAKE UP."
  ];
  let content = "";
  for (const line of lines) {
    content += line + "\n";
    terminal.textContent = toZalgo(content);
    playNoise(0.05, 0.3);
    await wait(Math.random() * 400 + 100);
  }
  await wait(1000);
  for (let i = 0; i < 50; i++) {
    content += toZalgo("ERROR 0x00000000 FATAL ") + "\n";
    terminal.textContent = content;
    terminal.scrollTop = terminal.scrollHeight;
    await wait(20);
  }
  terminal.style.display = 'none';
}

async function stageFive() {
  corruption = 1;
  cat.frozen = false;
  ended = false;
  inputLag = 1;
  stageDiv.style.filter = "invert(100%) hue-rotate(180deg)";
  
  await wait(2500);
  corruption = 2;
  cat.black = true;
  
  const eater = setInterval(() => {
    missingTiles.push({ x: Math.floor(Math.random() * (world.w / 80)) * 80, y: Math.floor(Math.random() * (world.h / 80)) * 80 });
  }, 80);
  
  await wait(2600);
  corruption = 3;
  flicker = 0.2;
  redFlash = true;
  triggerHeartbeat();
  
  await wait(2200);
  corruption = 4;
  ended = true;
  cat.frozen = true;
  document.body.classList.add('shake');
  
  await wait(2400);
  clearInterval(eater);

  sys.style.display = 'flex';
  sysText.textContent = toZalgo('GAME DATA CORRUPTED');
  playNoise(2, 1);
  
  await wait(3000);
  sysText.textContent = 'RECOVERING...';
  bar.style.display = 'block';
  for (let p = 0; p <= 100; p++) {
    barfill.style.width = p + '%';
    await wait(p > 88 ? 90 : 20);
  }
  
  await wait(700);
  bar.style.display = 'none';
  sysText.textContent = toZalgo('RECOVERY FAILED.');
  bloodOverlay.style.opacity = 1;
  triggerHeartbeat();
  
  await wait(3000);
  sys.style.display = 'none';
  
  await terminalGlitch();

  welcome.classList.add('active');
  document.body.style.background = '#000';
  document.body.classList.remove('shake');
  bloodOverlay.style.opacity = 0;
  stageDiv.style.display = 'none';

  const finalText = 'WELCOME TO THE GAME';
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';
  welcomeText.textContent = '';
  
  for (let i = 0; i < finalText.length; i++) {
    const span = document.createElement('span');
    span.textContent = finalText[i] === ' ' ? '\u00A0' : finalText[i];
    span.style.animationDelay = (i * 0.05) + 's';
    welcomeText.appendChild(span);
  }

  const spans = Array.from(welcomeText.children);
  for (let cycle = 0; cycle < 30; cycle++) {
    spans.forEach((span, idx) => {
      if (finalText[idx] === ' ') return;
      if (Math.random() < 0.7 && cycle < 25) span.textContent = chars[Math.floor(Math.random() * chars.length)];
      else span.textContent = finalText[idx];
    });
    if (cycle % 2 === 0 && AC) blip(40 + rnd(0, 100), 0.1, 'sawtooth', 0.8);
    await wait(50 + cycle * 10);
  }
  spans.forEach((span, idx) => span.textContent = finalText[idx] === ' ' ? '\u00A0' : finalText[idx]);

  await wait(3600);

  document.body.classList.add('shake');
  if (AC) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sawtooth';
    o.frequency.value = 50;
    g.gain.value = 1;
    o.connect(g);
    g.connect(master);
    o.start();
    o.stop(AC.currentTime + 3);
  }
  
  await wait(400);
  flash.style.transition = 'opacity 0.2s linear';
  flash.style.opacity = 1;
  flash.style.background = '#ff0000';
  
  await wait(400);
  flash.style.background = '#000';
  welcome.classList.remove('active');
  stopDrone();
  
  await wait(3000);
  location.replace('index2.html');
}

function handleFullscreenStatus() {
  const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
  
  if (!isFS && gameStarted) {
    running = false;
    fsReq.classList.add('active');
    if (AC && AC.state === 'running') AC.suspend();
  } else if (isFS && gameStarted) {
    running = true;
    fsReq.classList.remove('active');
    if (AC && AC.state === 'suspended') AC.resume();
  }
}

['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
  document.addEventListener(evt, handleFullscreenStatus);
});

async function requestFS() {
  const doc = document.documentElement;
  try {
    if (doc.requestFullscreen) await doc.requestFullscreen();
    else if (doc.webkitRequestFullscreen) await doc.webkitRequestFullscreen();
    else if (doc.mozRequestFullScreen) await doc.mozRequestFullScreen();
    else if (doc.msRequestFullscreen) await doc.msRequestFullscreen();
  } catch (err) {}
}

document.getElementById('go').addEventListener('click', async () => {
  initAudio();
  await requestFS();
  
  document.getElementById('start').style.display = 'none';
  gameStarted = true;
  
  setTimeout(() => {
    const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
    if (isFS) {
      if (AC && AC.state === 'suspended') AC.resume();
      startMusic();
      running = true;
    } else {
      handleFullscreenStatus();
    }
  }, 250);
});

fsBtn.addEventListener('click', async () => {
  await requestFS();
});
})();
